<!DOCTYPE html>

<head>

  <meta name="description" content="Vựa giúp chủ vựa nông sản ghi phiếu cân, theo dõi lô hàng và đối chiếu công nợ thương lái ngay trên điện thoại." />

  <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />

  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

  <!-- ============================================================
       TODO buổi 4 · tiết 3 — Tính năng 4: chống nháy trắng khi tải trang tối
       ------------------------------------------------------------
       Viết ở ĐÂY một đoạn <script> thường (KHÔNG type="module"), làm 3 việc:
         1. Đọc localStorage khóa "theme". Có thì nghe theo người dùng.
         2. Chưa có thì nghe theo hệ điều hành:
            window.matchMedia("(prefers-color-scheme: dark)").matches
         3. Bật/tắt class "dark" trên <html>, rồi thêm class "js" cho <html>.

       Vì sao phải nằm ngay đây, trong <head>, mà không nằm trong main.js:
       main.js nạp ở cuối <body>, lúc đó trình duyệt đã vẽ xong nền trắng —
       người dùng thấy một cú chớp trắng ở mỗi lần tải trang.

       Class "js" là hợp đồng với CSS: xem khối ".js [data-reveal]" trong
       src/input.css. Chưa có class này thì các khối lộ dần hiện bình thường,
       nên trang không bao giờ trắng trơn vì JavaScript hỏng.
       ============================================================ -->


  <link rel="stylesheet" href="./dist/output.css" />
</head>

<body>

  <!-- BUỔI 4 · Tính năng 2 — mốc theo dõi cuộn trang.
       Một thẻ rỗng cao 1px đặt ngay đầu <body>. Khi nó trôi khỏi màn hình
       nghĩa là trang đã cuộn. IntersectionObserver chỉ báo đúng hai lần
       (lúc ra, lúc vào); sự kiện scroll bắn hàng trăm lần mỗi giây. -->
  <div id="nav-sentinel" aria-hidden="true" class="h-px w-full"></div>

  <!-- Link bỏ qua điều hướng: chỉ hiện khi người dùng nhấn Tab.
       Thử ngay: tải trang rồi nhấn Tab một lần. -->
  <a href="#main"
     class="btn btn-primary sr-only focus:not-sr-only focus:absolute focus:left-4 focus:top-4 focus:z-50">
    Bỏ qua đến nội dung chính
  </a>


  <!-- ============================================================
       NAVBAR  —  hoàn thành ở BUỔI 1, tiết 4
       ============================================================ -->
  <header class="sticky top-0 z-40 border-b border-line bg-surface/85 backdrop-blur">
    <nav class="mx-auto flex max-w-6xl items-center justify-between px-5 py-4"
         aria-label="Điều hướng chính">

      <!-- Logo dùng <a> vì nó ĐƯA NGƯỜI DÙNG ĐI ĐÂU ĐÓ -->
      <a href="./index.html" class="flex items-center gap-2.5">
        <span class="grid h-9 w-9 place-items-center rounded-lg bg-brand-600
                     font-display text-lg font-extrabold text-white">V</span>
        <span class="font-display text-xl font-extrabold">Vựa</span>
      </a>

      <!-- Menu desktop. Ẩn dưới lg — nút hamburger bên phải thay chỗ.
           Buổi 3 thêm hai trang mới vào menu này. -->
      <ul class="hidden items-center gap-8 text-sm font-medium lg:flex">
        <li><a href="./index.html#tinh-nang" class="link-nav">Tính năng</a></li>
        <li><a href="./index.html#cach-hoat-dong" class="link-nav">Cách hoạt động</a></li>
        <li><a href="./pricing.html" class="link-nav">Bảng giá</a></li>
        <li><a href="./contact.html" class="link-nav">Liên hệ</a></li>
      </ul>

      <div class="flex items-center gap-2">
        <!-- Nút bật/tắt nền tối. Markup dựng ở buổi 3, JavaScript gắn ở buổi 4.
             Trong lúc chờ, kiểm tra dark mode bằng cách thêm tay class="dark"
             vào thẻ <html> trong DevTools. -->
        <button type="button" id="nut-nen-toi"
                class="grid h-10 w-10 place-items-center rounded-pill border border-line"
                aria-pressed="false" aria-label="Chuyển nền sáng / nền tối">
          <svg class="h-5 w-5 dark:hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
            <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z" />
          </svg>
          <svg class="hidden h-5 w-5 dark:block" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4" />
            <path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4" />
          </svg>
        </button>

        <a href="./contact.html" class="btn btn-primary hidden lg:inline-flex">Dùng thử 30 ngày</a>

        <!-- Nút hamburger dùng <button> vì nó THỰC HIỆN MỘT HÀNH ĐỘNG.
             Markup có sẵn từ buổi 1; buổi 4 mới gắn JavaScript cho chạy. -->
        <button type="button"
                class="grid h-10 w-10 place-items-center rounded-pill border border-line lg:hidden"
                aria-expanded="false" aria-controls="nav-mobile" aria-label="Mở menu">
          <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <path d="M4 7h16M4 12h16M4 17h16" />
          </svg>
        </button>
      </div>
    </nav>

    <!-- Menu mobile: khung có sẵn, chưa mở được. Buổi 4 xử lý. -->
    <div id="nav-mobile" class="hidden border-t border-line px-5 pb-6 pt-4 lg:hidden">
      <ul class="flex flex-col gap-1 text-base font-medium">
        <li><a href="./index.html#tinh-nang" class="block rounded-lg px-3 py-2.5 hover:bg-surface-alt">Tính năng</a></li>
        <li><a href="./index.html#cach-hoat-dong" class="block rounded-lg px-3 py-2.5 hover:bg-surface-alt">Cách hoạt động</a></li>
        <li><a href="./pricing.html" class="block rounded-lg px-3 py-2.5 hover:bg-surface-alt">Bảng giá</a></li>
        <li><a href="./contact.html" class="block rounded-lg px-3 py-2.5 hover:bg-surface-alt">Liên hệ</a></li>
      </ul>
      <a href="./contact.html" class="btn btn-primary btn-lg mt-4 w-full">Dùng thử 30 ngày</a>
    </div>
  </header>
